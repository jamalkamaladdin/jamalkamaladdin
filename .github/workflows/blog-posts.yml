name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from camalali.com
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://camalali.com/rss.xml"
          max_post_count: 5
          template: "- [$title]($url)<br>"
          commit_message: "chore(readme): refresh latest posts"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
